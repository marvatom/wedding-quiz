# Wedding quiz questions
# Edit this file to add, remove, or change questions.
# Each question needs:
#   id: a stable integer — this determines the URL hash. Never change it once QR codes are printed.
#       To add a new question, pick the next unused integer (do not reuse ids).
#   stem: the question text (safe to change — does not affect the URL)
#   choices: list of answer options, each with:
#     text: the answer text shown to the guest
#     correct: true | false  (at least one must be true)

questions:
  - id: 1
    stem: "Čím chtěli být ženich a nevěsta, když byli malí?"
    choices:
      - text: "Hasičem a učitelkou"
        correct: true
      - text: "Popelářem a právničkou"
        correct: false
      - text: "Doktorem a doktorkou"
        correct: false

  - id: 2
    stem: "Jaký je společný zájem novomanželů?"
    choices:
      - text: "Lukostřelba"
        correct: false
      - text: "Běh"
        correct: false
      - text: "Step"
        correct: true

  - id: 3
    stem: "Kde se novomanželé poprvé setkali?"
    choices:
      - text: "V práci - na urgentním přijmu"
        correct: true
      - text: "Na vandru - byla to náhoda"
        correct: false
      - text: "v hospodě na kytarovém hraní"
        correct: false

  - id: 4
    stem: "Kam vedla úplně první společná dovolená novomanželů?"
    choices:
      - text: "Nikam - byli doma"
        correct: false
      - text: "Vandr do přírody"
        correct: false
      - text: "Přechod Krkonoš"
        correct: true

  - id: 5
    stem: "Který filmový žánr si novomanželé nejraději pustí před spaním?"
    choices:
      - text: "Fantasy nebo sci-fi"
        correct: false
      - text: "Pohádky"
        correct: true
      - text: "Romantický film"
        correct: false

  - id: 6
    stem: "Kdo plakal víc při zásnubách?"
    choices:
      - text: "Ženich"
        correct: false
      - text: "Nevěsta"
        correct: false
      - text: "Oba stejně"
        correct: true

  - id: 7
    stem: "Jaké zvíře si novomanželé domů jistě pořídí?"
    choices:
      - text: "Hada"
        correct: false
      - text: "Psa"
        correct: false
      - text: "Křečka"
        correct: true

  - id: 8
    stem: "Jak dlouho se novomanželé znají?"
    choices:
      - text: "2 roky"
        correct: false
      - text: "4 roky"
        correct: true
      - text: "6 let"
        correct: false

  - id: 9
    stem: "Jaké vozidlo řídila nevěsta, ale ženich nikdy?"
    choices:
      - text: "Motorka"
        correct: false
      - text: "Traktor"
        correct: false
      - text: "Motokára"
        correct: true

  - id: 10
    stem: "Za kterou památkou by novomanželé raději vycestovali?"
    choices:
      - text: "Hrad Carcassone (Francie)"
        correct: true
      - text: "Šikmá vež v Pise (Itálie)"
        correct: false
      - text: "Schönbrunský zámek (Rakusko)"
        correct: false

  - id: 11
    stem: "Jaká byla cílová destinace prvního společného vandru novomanželů?"
    choices:
      - text: "Tomovo tábořiště (Údolí duchů)"
        correct: true
      - text: "Sluneční zátoka (Hoši od bobří řeky)"
        correct: false
      - text: "Zuzčino první tábořiště"
        correct: false

  - id: 12
    stem: "Jaké je oblíbené společné jídlo/vaření novomanželů?"
    choices:
      - text: "Domácí pizza"
        correct: true
      - text: "Sushi"
        correct: false
      - text: "Lívance"
        correct: false

  - id: 13
    stem: "Kde se nevěsta poprvé seznámila s rodiči ženicha?"
    choices:
      - text: "Na společném výletě"
        correct: false
      - text: "po přespávačce"
        correct: true
      - text: "Na vandru"
        correct: false

  - id: 14
    stem: "Kolik je žijících lidí s příjmením Mondschein (i s nevěstou)?"
    choices:
      - text: "7"
        correct: false
      - text: "19"
        correct: false
      - text: "34"
        correct: false
      - text: "47"
        correct: true

  - id: 15
    stem: "Jakou barvu oba novomanželé nesnáší?"
    choices:
      - text: "Žlutou"
        correct: false
      - text: "Růžovou"
        correct: true
      - text: "Hnědou"
        correct: false
