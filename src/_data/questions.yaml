# Wedding quiz questions
# Edit this file to add, remove, or change questions.
# Each question needs:
#   id: a stable integer — this determines the URL hash. Never change it once QR codes are printed.
#       To add a new question, pick the next unused integer (do not reuse ids).
#   stem: the question text (safe to change — does not affect the URL)
#   choices: list of answer options, each with:
#     text: the answer text shown to the guest
#     correct: true | false  (at least one must be true)

questions:
  - id: 1
    stem: "Jak se pár poprvé potkal?"
    choices:
      - text: "V kavárně"
        correct: true
      - text: "Na párty"
        correct: false
      - text: "Přes společné přátele"
        correct: false
      - text: "Přes online seznamku"
        correct: false

  - id: 2
    stem: "Ve kterém městě měl pár první rande?"
    choices:
      - text: "Praha"
        correct: true
      - text: "Vídeň"
        correct: false
      - text: "Brno"
        correct: false
      - text: "Budapešť"
        correct: false

  - id: 3
    stem: "V jakém roce se pár zasnoubil?"
    choices:
      - text: "2022"
        correct: false
      - text: "2023"
        correct: true
      - text: "2024"
        correct: false
      - text: "2025"
        correct: false

  - id: 4
    stem: "Co umí ženich i nevěsta?"
    choices:
      - text: "Řídit auto"
        correct: true
      - text: "Zpívat"
        correct: true
      - text: "Háčkovat"
        correct: false
      - text: "Bavit se až do rána"
        correct: true
