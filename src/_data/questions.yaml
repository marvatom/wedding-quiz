# Wedding quiz questions
# Edit this file to add, remove, or change questions.
# Each question needs:
#   stem: the question text (also determines the URL hash — changing it invalidates printed QR codes)
#   choices: list of answer options, each with:
#     text: the answer text shown to the guest
#     correct: true | false  (at least one must be true)

questions:
  - stem: "Jak se pár poprvé potkal?"
    choices:
      - text: "V kavárně"
        correct: true
      - text: "Na párty"
        correct: false
      - text: "Přes společné přátele"
        correct: false
      - text: "Přes online seznamku"
        correct: false

  - stem: "Ve kterém městě měl pár první rande?"
    choices:
      - text: "Praha"
        correct: true
      - text: "Vídeň"
        correct: false
      - text: "Brno"
        correct: false
      - text: "Budapešť"
        correct: false

  - stem: "V jakém roce se pár zasnoubil?"
    choices:
      - text: "2022"
        correct: false
      - text: "2023"
        correct: true
      - text: "2024"
        correct: false
      - text: "2025"
        correct: false

  - stem: "Co umí ženich i nevěsta?"
    choices:
      - text: "Řídit auto"
        correct: true
      - text: "Zpívat"
        correct: true
      - text: "Háčkovat"
        correct: false
      - text: "Bavit se až do rána"
        correct: true
